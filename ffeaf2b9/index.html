<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ananya Sharma — SAI Connect</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    color: #f0f0f0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 1.5rem;
  }
  .card {
    background: rgba(255,255,255,0.07);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 1.2rem;
    padding: 2rem;
    max-width: 380px;
    width: 100%;
    text-align: center;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  .photo {
    width: 160px; height: 240px;
    object-fit: cover;
    border-radius: 0.8rem;
    margin: 0 auto 1.2rem;
    border: 3px solid rgba(255,255,255,0.15);
    display: block;
  }
  .name {
    font-size: 1.4rem; font-weight: 700;
    margin-bottom: 0.3rem;
    background: linear-gradient(90deg, #a78bfa, #60a5fa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .sai-id {
    font-size: 0.85rem; color: #9ca3af;
    letter-spacing: 0.1em;
    margin-bottom: 1.2rem;
  }
  .qr { width: 140px; height: 140px; margin: 0 auto; }
  .qr img { width: 100%; border-radius: 0.5rem; }
  .footer {
    margin-top: 1rem;
    font-size: 0.7rem;
    color: #6b7280;
  }
</style>
</head>
<body>
<div class="card">
  <img class="photo" src="photo.jpg" alt="Ananya Sharma">
  <div class="name">Ananya Sharma</div>
  <div class="sai-id">SAI2026A91KX</div>
  <div class="qr"><img src="qr.png" alt="QR Code"></div>
  <div class="footer">SAI Connect &bull; Verified Member</div>
</div>
</body>
</html>
